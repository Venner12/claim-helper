<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claim Helper</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="claim-panel" aria-labelledby="claim-title">
        <div class="button-grid" aria-label="Claim actions">
          <button type="button" data-claim-type="tiktok">Get TikTok Link</button>
          <button type="button" data-claim-type="youtube">Get YouTube Link</button>
          <button type="button" data-claim-type="comment">Get Comment</button>
        </div>

        <div class="result-grid" aria-live="polite">
          <div class="result-box">
            <span class="label">Your TikTok link</span>
            <p id="result-tiktok">No TikTok link claimed yet.</p>
          </div>

          <div class="result-box">
            <span class="label">Your YouTube link</span>
            <p id="result-youtube">No YouTube link claimed yet.</p>
          </div>

          <div class="result-box">
            <span class="label">Your comment</span>
            <p id="result-comment">No comment claimed yet.</p>
          </div>
        </div>

      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
